name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verify before release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run full test suite
        run: mvn --batch-mode --no-transfer-progress verify

  publish:
    name: Publish container
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}

  canary:
    name: Start canary release
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy candidate to 10% of traffic
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ] || [ -z "$DEPLOY_WEBHOOK_TOKEN" ]; then
            echo "::error::Configure DEPLOY_WEBHOOK_URL and DEPLOY_WEBHOOK_TOKEN in the production environment."
            exit 1
          fi
          curl --fail --show-error --silent \
            --request POST "$DEPLOY_WEBHOOK_URL" \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $DEPLOY_WEBHOOK_TOKEN" \
            --data "{\"image\":\"$IMAGE\",\"strategy\":\"canary\",\"trafficPercent\":10,\"commit\":\"${GITHUB_SHA}\"}"
